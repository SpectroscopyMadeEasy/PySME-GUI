<!doctype html>
<!-- What the Mac app shows before the interface can run: first-launch setup,
     updates, start-up and failures. PySMEApp.swift calls window.setup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PySME setup</title>
<style>
:root {
  --bg: #f3f3f1; --surface: #fcfcfb; --border: #dddcd6; --text: #17171a; --muted: #62615c;
  --accent: #eb6834; --ok: #0f7a4f; --err: #c22f2e; --track: #e8e7e2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1a1a19; --border: #363632; --text: #efeee9; --muted: #a5a49d;
    --accent: #d95926; --ok: #4cc795; --err: #ff7b7a; --track: #2b2b28;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; padding: 24px; overflow: auto;
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; cursor: default;
}
main {
  margin: auto; width: 100%; max-width: 520px; padding: 30px 36px 22px; text-align: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.10);
}
img { width: 92px; height: 92px; display: block; margin: 0 auto 6px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
#note { margin: 6px 0 0; color: var(--muted); }

.bar { height: 6px; margin: 22px 0 0; border-radius: 3px; background: var(--track); overflow: hidden; position: relative; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 3px; background: var(--accent); transition: width 0.5s ease; }
/* No honest percentage exists within a step, so a moving part shows life. */
.bar b { position: absolute; top: 0; bottom: 0; width: 28%; border-radius: 3px; background: var(--accent); opacity: 0.45; animation: slide 1.5s ease-in-out infinite; }
@keyframes slide { from { left: -30%; } to { left: 102%; } }

ol { list-style: none; margin: 18px 0 0; padding: 0; text-align: left; }
li { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; padding: 7px 0; color: var(--muted); }
li .mark { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 700; line-height: 1; }
li.active { color: var(--text); font-weight: 600; }
li.active .mark { border-color: var(--track); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
li.done { color: var(--text); }
li.done .mark { border-color: var(--ok); background: var(--ok); color: var(--surface); }
li.done .mark::after { content: "✓"; }
li.failed { color: var(--text); font-weight: 600; }
li.failed .mark { border-color: var(--err); background: var(--err); color: var(--surface); }
li.failed .mark::after { content: "!"; }
li small { grid-column: 2; display: block; font: 11px/1.5 ui-monospace, Menlo, monospace; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 0; }
li small:empty { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

#elapsed { margin: 10px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
details { margin-top: 12px; text-align: left; }
summary { font-size: 12px; color: var(--muted); text-align: center; cursor: pointer; }
pre {
  height: 150px; margin: 8px 0 0; padding: 8px 10px; overflow: auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
  -webkit-user-select: text; user-select: text; cursor: text;
}
#help { margin: 14px 0 0; font-size: 12px; }
#help button { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .bar b { display: none; } li.active .mark { animation: none; } }
</style>
</head>
<body>
<main>
  <img id="icon" src="setup-icon.png" alt="">
  <h1 id="title">PySME</h1>
  <p id="note"></p>
  <div class="bar" id="bar" role="progressbar" aria-label="Progress"><i id="fill"></i><b id="pulse"></b></div>
  <ol id="steps" aria-live="polite">
    <li><span class="mark"></span><span>Preparing Python</span><small></small></li>
    <li><span class="mark"></span><span>Installing PySME and its dependencies</span><small></small></li>
    <li><span class="mark"></span><span>Checking that PySME runs</span><small></small></li>
  </ol>
  <p id="elapsed"></p>
  <details id="details"><summary>Show details</summary><pre id="log"></pre></details>
  <p id="help" hidden>Taking too long? <button type="button" id="report">Report a problem…</button></p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const steps = Array.from(document.querySelectorAll("#steps li"));
const HELP_AFTER = 180;       // seconds
let timer = null, started = 0, current = -1;

function clock() {
  const seconds = Math.floor((Date.now() - started) / 1000);
  const text = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  $("elapsed").textContent = current === 2 ? `${text} elapsed · the first check can take a minute` : `${text} elapsed`;
  $("help").hidden = seconds < HELP_AFTER;
}

window.setup = {
  /* mode: "install" (three steps), "start" (no steps) or "stopped". */
  show(mode, title, note) {
    clearInterval(timer);
    current = -1;
    $("title").textContent = title;
    $("note").textContent = note || "";
    $("bar").hidden = mode === "stopped";
    $("pulse").hidden = false;
    $("fill").style.width = "0";
    $("steps").hidden = mode !== "install";
    $("elapsed").hidden = mode !== "install";
    $("details").hidden = mode === "start";
    $("details").open = false;
    $("help").hidden = true;
    $("log").textContent = "";
    for (const step of steps) {
      step.className = "";
      step.querySelector("small").textContent = "";
    }
    if (mode === "install") {
      started = Date.now();
      clock();
      timer = setInterval(clock, 1000);
    }
  },
  step(number) {
    current = number - 1;
    steps.forEach((step, i) => {
      step.className = i < current ? "done" : i === current ? "active" : "";
      if (i !== current) step.querySelector("small").textContent = "";
    });
    $("fill").style.width = `${(current / steps.length) * 100}%`;
    clock();
  },
  line(text) {
    const log = $("log");
    const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
    log.append(text + "\n");
    if (atEnd) log.scrollTop = log.scrollHeight;
    if (current >= 0 && text.trim() && !text.startsWith("STEP ")) {
      steps[current].querySelector("small").textContent = text.trim();
    }
  },
  fail() {
    clearInterval(timer);
    $("title").textContent = "Setup did not finish";
    $("note").textContent = "The details below show what went wrong.";
    $("pulse").hidden = true;
    if (current >= 0) steps[current].className = "failed";
    $("elapsed").hidden = true;
    $("help").hidden = true;
    $("details").hidden = false;
    $("details").open = true;
    $("log").scrollTop = $("log").scrollHeight;
  },
};

$("details").addEventListener("toggle", () => {
  $("details").querySelector("summary").textContent = $("details").open ? "Hide details" : "Show details";
  $("log").scrollTop = $("log").scrollHeight;
});
$("report").addEventListener("click", () => {
  window.webkit?.messageHandlers?.setup?.postMessage("report");
});
</script>
</body>
</html>
